[package]
name = "asmr_translator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "把日语 ASMR 音声/视频批量翻译成中文字幕（VAD 前置，只分离语音段）"
repository = ""

[dependencies]
encoding_rs = "0.8.42"
regex = "1.13.1"
rfd = "0.17.2"
windows-reactor = "0.100"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

# 本地打过补丁的 windows-reactor：Win10 上回退到 Bootstrap DLL（原版静态调用 Win11-only API）
[patch.crates-io]
windows-reactor = { path = "../vendor/windows-reactor" }
